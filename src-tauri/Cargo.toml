[package]
name = "novelpia-cover-archive"
version = "2.0.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "NovelpiaCoverArchive"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
html5ever = "0.35"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
md5 = "0.8"
open = "5"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "brotli"] }
rfd = { version = "0.15", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-single-instance = "2"
tempfile = "3"
unicode-normalization = "0.1"
url = "2"
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Variant", "Win32_Storage_FileSystem"] }
winreg = "0.55"

[profile.release]
lto = "thin"
strip = "symbols"
