name: Tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo +stable fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo +stable test --locked --manifest-path src-tauri/Cargo.toml
